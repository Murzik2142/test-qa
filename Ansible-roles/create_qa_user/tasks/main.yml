---
- name: Ensure qa user exists
  ansible.builtin.user:
    name: qa
    state: present
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true

- name: Generate random password for qa user
  ansible.builtin.set_fact:
    random_password: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

- name: Set password for qa user
  ansible.builtin.user:
    name: qa
    password: "{{ random_password | password_hash('sha512') }}"

- name: Display generated password
  ansible.builtin.debug:
    msg: "Generated password for qa user: {{ random_password }}"

- name: Create .ssh directory for qa user
  ansible.builtin.file:
    path: /home/qa/.ssh
    state: directory
    owner: qa
    group: qa
    mode: '0700'

- name: Generate SSH key pair for qa user
  ansible.builtin.user:
    name: qa
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
    ssh_key_comment: "qa_user_key"

- name: Get generated public key
  ansible.builtin.slurp:
    src: /home/qa/.ssh/id_ed25519.pub
  register: qa_public_key

- name: Display public SSH key
  ansible.builtin.debug:
    msg: "Public SSH key for qa user:\n{{ qa_public_key['content'] | b64decode }}"
